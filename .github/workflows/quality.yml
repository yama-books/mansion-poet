name: Verify mansion-poet

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - src/**
      - .github/workflows/quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser-state regression tests with mocked APIs
        run: node --test tests/*.test.mjs tests/print-layout/*.test.mjs
