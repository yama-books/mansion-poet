name: PRINT03-IMG-01 isolated preview QA
on:
  push:
    branches: [feature/app003-print03-img01-poc-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese fonts for faithful A4 review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Existing print regression and new adapter tests
        run: node --test tests/*.test.mjs tests/print-layout/*.test.mjs
      - name: Chromium A4 image/SVG comparisons
        run: node tests/print-layout/img01/browser-qa.mjs
      - name: Save browser evidence (even when a case fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print03-img01-review
          path: tests/print-layout/img01/qa-output
          if-no-files-found: warn
