name: APP-003 mobile device viewport QA

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - tests/mobile-device/**
      - .github/workflows/mobile-device-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing app and location-race tests
        run: node --test tests/*.test.mjs
      - name: Install small browser automation driver
        run: npm install --no-save --ignore-scripts --package-lock=false playwright-core@1.56.1
      - name: Ensure Japanese text renders in screenshot review (bounded)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          # Missing fonts must not consume the entire job or prevent functional E2E.
          if fc-list :lang=ja family | grep -q .; then
            echo "Japanese font already available"
          else
            echo "Attempting a time-bounded Japanese font installation"
            sudo timeout --signal=TERM --kill-after=5s 80s env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-cjk               || echo "::warning::Japanese font installation unavailable; functional browser QA continues. Screenshot glyphs require review."
          fi
          # Do not force-rebuild the entire runner font cache (previous run hung here).
          echo "Japanese font candidate: $(fc-match -f '%{family}' ':lang=ja')"
      - name: Real Chrome 320, 375, 390, 430px and desktop smoke
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/app003-ui01-mobile-screens
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "::error::Chromium unavailable"; exit 1; fi
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/ui01-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null
          CHROME_PATH="$CHROME_BIN" APP003_TEST_URL="http://127.0.0.1:8765/index.html" APP003_SCREENSHOTS="$SCREENSHOT_DIR" node tests/mobile-device/browser-smoke.cjs
          CHROME_PATH="$CHROME_BIN" APP003_TEST_URL="http://127.0.0.1:8765/index.html" APP003_SCREENSHOTS="$SCREENSHOT_DIR" node tests/mobile-device/full-flow.cjs
      - name: Package isolated Web UI preview (not deployed)
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/app003-ui01-preview"
          mkdir -p "$dest/src"
          cp index.html "$dest/index.html"
          cp src/subject-policy.js src/poem-catalog.js src/location-highlights.js "$dest/src/"
          test -s "$dest/index.html"
          for f in subject-policy.js poem-catalog.js location-highlights.js; do test -s "$dest/src/$f"; done
          cat > "$dest/PREVIEW_README.txt" <<'EOF'
          APP-003 UI01-MOBILE candidate, Draft PR #40.
          Not a published GitHub Pages URL. Requires an HTTPS static host to test iPhone Safari.
          The HTML makes external tile/geocoder/POI calls only on user interaction.
          This artifact preserves the exact candidate files for a later reviewed staging deployment.
          EOF
      - name: Upload standalone Web UI preview files
        uses: actions/upload-artifact@v4
        with:
          name: app003-ui01-preview-site
          path: ${{ runner.temp }}/app003-ui01-preview
          retention-days: 7
          if-no-files-found: error
      - name: Upload viewport review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app003-ui01-mobile-viewports
          path: ${{ runner.temp }}/app003-ui01-mobile-screens
          retention-days: 7
          if-no-files-found: ignore
