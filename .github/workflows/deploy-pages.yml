name: Publish mansion-poet to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - src/**
      - tools/reference-gallery/**
      - research/visual-reference-manifest.json
      - assets/reference-images/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node for regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify location and generation behavior before deployment
        run: node --test tests/*.test.mjs

      - name: Verify reference-gallery image manifest before publishing
        run: |
          python3 -m unittest discover -s tests/reference-gallery -p 'test_*.py' -v
          python3 scripts/reference-gallery/build_preview.py --output "$RUNNER_TEMP/gallery-preview"

      - name: Create minimal site artifact
        run: |
          mkdir -p public
          cp index.html public/index.html
          mkdir -p public/src
          cp src/subject-policy.js public/src/subject-policy.js
          test -s public/src/subject-policy.js
          cp src/poem-catalog.js public/src/poem-catalog.js
          cp src/location-highlights.js public/src/location-highlights.js
          # Approved public layout: SVG only. The independent ART candidate and
          # reference crop remain in GitHub, never in this Pages artifact.
          mkdir -p public/src/print-layout public/tests/print-layout/img01
          cp src/print-layout/*.js src/print-layout/*.css public/src/print-layout/
          cp tests/print-layout/img01/img01-preview.css public/tests/print-layout/img01/
          test -s public/src/print-layout/live-app.js
          test -s public/src/print-layout/paginate.js
          test -s public/src/print-layout/print-layout.css
          test ! -e public/assets/art-candidates/asset-art-01/ART-REF0003-PHOTO-01.png
          test -s public/src/poem-catalog.js
          test -s public/src/location-highlights.js
          touch public/.nojekyll
          test -s public/index.html
          mkdir -p public/tools public/research public/assets
          cp -a "$RUNNER_TEMP/gallery-preview/tools/reference-gallery" public/tools/
          cp -a "$RUNNER_TEMP/gallery-preview/src/reference-gallery" public/src/
          cp -a "$RUNNER_TEMP/gallery-preview/research/visual-reference-manifest.json" public/research/
          cp -a "$RUNNER_TEMP/gallery-preview/assets/reference-images" public/assets/
          test -s public/tools/reference-gallery/index.html
          test -s public/src/reference-gallery/gallery-model.js
          test -s public/research/visual-reference-manifest.json
          test "$(find public/assets/reference-images -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 19
          grep -q 'noindex,nofollow,noarchive' public/tools/reference-gallery/index.html

      - name: Build isolated PRINT03-IMG-01 review preview
        shell: bash
        run: |
          set -euo pipefail
          # Preview only: pin immutable commits from draft PR #39 and base PR #31.
          # Never copy this sample photo into the approved production ART folder.
          PRINT_COMMIT="037ee9a45738544e54ce6584439e22e9d4b3c826"
          IMG_COMMIT="2182adbbd6619f4f6411c56b1f29fed2346794cf"
          git fetch --no-tags --depth=1 origin "$PRINT_COMMIT" "$IMG_COMMIT"
          dest="public/tools/print03-img01"
          mkdir -p "$dest"
          for name in presentation-data.js render-core.js templates.js paginate.js neighborhood.js print-layout.css; do
            git show "$PRINT_COMMIT:src/print-layout/$name" > "$dest/$name"
          done
          git show "$PRINT_COMMIT:src/subject-policy.js" > "$dest/subject-policy.js"
          git show "$PRINT_COMMIT:tests/print-layout/fixtures.js" > "$dest/fixtures.js"
          git show "$IMG_COMMIT:src/print-layout/img01-preview.js" > "$dest/img01-preview.js"
          git show "$IMG_COMMIT:tests/print-layout/img01/img01-preview.css" > "$dest/img01-preview.css"
          git show "$IMG_COMMIT:tests/print-layout/img01/ART-REF0003-library-refcrop.png" > "$dest/ART-REF0003-library-refcrop.png"
          git show "$IMG_COMMIT:tests/print-layout/img01/preview.html" > "$dest/index.html"
          python3 - <<'PY'
          from pathlib import Path
          html_path = Path('public/tools/print03-img01/index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('../../../src/print-layout/', './').replace('../../../src/', './')
          html = html.replace('../fixtures.js', './fixtures.js')
          html = html.replace('<title>', '<meta name="robots" content="noindex,nofollow,noarchive">\n<title>', 1)
          html_path.write_text(html, encoding='utf-8')
          PY
          # Assert 1) every browser dependency exists, 2) preview is clearly
          # labelled as fictional, 3) exact PNG bytes are preserved.
          for f in index.html print-layout.css img01-preview.css presentation-data.js render-core.js templates.js paginate.js neighborhood.js subject-policy.js fixtures.js img01-preview.js ART-REF0003-library-refcrop.png; do
            test -s "$dest/$f"
          done
          grep -q '本番ART未承認' "$dest/index.html"
          grep -q 'noindex,nofollow,noarchive' "$dest/index.html"
          echo "8662274f6157e542c3004f4a23286a26e7f291d01f531cea6ef7206ff4744b5e  $dest/ART-REF0003-library-refcrop.png" | sha256sum --check

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public site and reference gallery are reachable
        run: |
          set -euo pipefail
          base="https://yama-books.github.io/mansion-poet"
          get() {
            curl --fail --silent --show-error --location --retry 10 --retry-delay 6 --retry-all-errors --max-time 15 "$1" -o "$2"
          }
          get "$base/" /tmp/app003-live-root.html
          get "$base/src/print-layout/live-app.js" /tmp/app003-live-print03.js
          grep -q 'PRINT03 live bridge' /tmp/app003-live-print03.js
          get "$base/src/print-layout/print-layout.css" /tmp/app003-live-print03.css
          grep -q -- '-webkit-text-size-adjust:100%' /tmp/app003-live-print03.css
          get "$base/tests/print-layout/img01/img01-preview.css" /tmp/app003-live-print03-img.css
          grep -iq '<!doctype html' /tmp/app003-live-root.html
          get "$base/tools/reference-gallery/index.html" /tmp/app003-live-gallery.html
          grep -q 'noindex,nofollow,noarchive' /tmp/app003-live-gallery.html
          grep -q 'gallery.js' /tmp/app003-live-gallery.html
          get "$base/tools/reference-gallery/gallery.js" /tmp/app003-live-gallery.js
          get "$base/tools/reference-gallery/gallery.css" /tmp/app003-live-gallery.css
          get "$base/src/reference-gallery/gallery-model.js" /tmp/app003-live-gallery-model.js
          get "$base/research/visual-reference-manifest.json" /tmp/app003-live-gallery-manifest.json
          get "$base/assets/reference-images/REF-0001-overview.png" /tmp/app003-live-sample.png
          python3 - <<'PY'
          import hashlib, json, pathlib
          m=json.loads(pathlib.Path('/tmp/app003-live-gallery-manifest.json').read_text())
          assert m['schemaVersion']=='app003.reference-library.v1'
          files=m['files']
          assert len(files)==19
          record=next(x for x in files if x['id']=='REF-0001-overview')
          img=pathlib.Path('/tmp/app003-live-sample.png').read_bytes()
          assert img[:8]==b'\x89PNG\r\n\x1a\n'
          assert len(img)==record['bytes']
          assert hashlib.sha256(img).hexdigest()==record['sha256']
          print('LIVE HTTP VERIFIED: app root, gallery, CSS/JS, reference manifest (19 images), sample PNG SHA256')
          PY
