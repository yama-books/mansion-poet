<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APP-003 PRINT03-IMG-01: EDITORIAL PHOTO preview</title>
<link rel="stylesheet" href="../../../src/print-layout/print-layout.css">
<link rel="stylesheet" href="./img01-preview.css">
<style>
body{margin:0;background:#dcd9d2;font:14px/1.5 system-ui,sans-serif;color:#202927}
.img01-tools{position:sticky;top:0;z-index:9;background:#223732;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.img01-tools select,.img01-tools input,.img01-tools button{font:inherit}
.img01-tools button{background:#f3eadd;color:#17352e;padding:6px 14px;border:0;border-radius:4px}
.img01-banner{background:#fff0d3;color:#654c20;padding:6px 14px;font-size:12px}
.img01-report{margin:6px auto;padding:12px;max-width:210mm;background:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
@media print{body{background:white}}
</style></head>
<body>
<div class="img01-tools">
<strong>PRINT03-IMG-01</strong>
<label>fixture <select id="fx"></select></label>
<label>画像 <select id="media"><option value="svg">従来SVG</option><option value="photo">参考写真</option><option value="missing">写真不達→SVG</option></select></label>
<label>写真枠 <select id="height"><option value="84">84mm</option><option value="72">72mm</option></select></label>
<label>焦点 <input type="range" id="focus" min="0" max="100" step="5" value="50"></label>
<label>面 <select id="sheet"><option value="auto">自動</option><option value="duplex">表裏</option></select></label>
<button id="print">印刷／PDF</button>
</div>
<div class="img01-banner">すべて架空の検証データです。写真はPR #37の参考切り出し（本番ART未承認）。実在施設や物件の外観ではありません。</div>
<div id="report" class="img01-report" role="status"></div>
<main id="out" class="pl-stage"></main>
<script src="../../../src/print-layout/presentation-data.js"></script>
<script src="../../../src/print-layout/render-core.js"></script>
<script src="../../../src/print-layout/templates.js"></script>
<script src="../../../src/print-layout/paginate.js"></script>
<script src="../../../src/subject-policy.js"></script>
<script src="../../../src/print-layout/neighborhood.js"></script>
<script src="../fixtures.js"></script>
<script src="../../../src/print-layout/img01-preview.js"></script>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);
const choices=['F01_jimbocho_3','F04_residential_0','F03_kyoto_3_longnames'];
for(const id of choices){const f=PrintFixtures.byId(id);if(f)$('fx').add(new Option(f.fixtureId+' '+f.description,id))}
$('fx').value=choices.includes(q.get('fixture'))?q.get('fixture'):choices[0];
$('media').value=['photo','missing'].includes(q.get('media'))?q.get('media'):'svg';
$('height').value=q.get('height')==='72'?'72':'84';
$('sheet').value=q.get('sheet')==='duplex'?'duplex':'auto';
$('focus').value=/^(?:0|[1-9]\d?|100)$/.test(q.get('focus')||'')?q.get('focus'):'50';
$('print').onclick=()=>window.print();
let ticket=0;
async function update(){
 const cur=++ticket,fixture=PrintFixtures.byId($('fx').value),media=$('media').value;
 $('report').textContent='組版中…';
 try{
  const r=await PrintImage01Preview.mount($('out'),fixture.data,{
    expectedToken:fixture.data.generationToken,media,
    mmHeight:+$('height').value,focus:+$('focus').value,sheet:$('sheet').value});
  if(cur!==ticket)return;
  const output={fixtureId:fixture.fixtureId,token:fixture.data.generationToken,mediaRequested:media,
    mediaUsed:r.mediaUsed,fallback:r.fallback,report:r.report,photoMetrics:r.photoMetrics};
  $('report').textContent=JSON.stringify(output,null,2);
  document.documentElement.dataset.img01=r.report.ok?'pass':'fail';
  document.documentElement.dataset.img01Mode=r.mediaUsed;
  document.documentElement.dataset.img01Ppi=String(r.photoMetrics?.effectivePpiCover??'n/a');
  window.__IMG01_RESULT=output;
 }catch(e){
  if(cur!==ticket)return;
  $('report').textContent='ERROR '+String(e);
  document.documentElement.dataset.img01='fail';
  window.__IMG01_RESULT={error:String(e)};
 }
}
['fx','media','height','focus','sheet'].forEach(id=>$(id).addEventListener('change',update));
(document.fonts?document.fonts.ready:Promise.resolve()).then(update);
})();
</script></body></html>
